syntax = "proto3";

option go_package = "./pb";

package pb;

message Machines {
  //@inject_tag: gorm:"primaryKey"
  int64  id      = 1;
  string name    = 2;
  string ip      = 3;
  string sn      = 4; // 序列号
  string address = 5;
  int32  status  = 6; // 状态
  //版本
  string version = 7;
  //支付配置
  string pay_config = 8;
  //当前模板
  string curr_template = 9;
}