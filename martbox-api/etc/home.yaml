Listen: 0.0.0.0:5001

Mode: pro

WebSocket:
  Path: /v1/ws
  Token: ""            # 非空时，设备连接需带 ?token=xxx
  AllowedOrigins: []   # 浏览器来源白名单，例如 https://admin.example.com；设备端不带 Origin，直接放行
  PingInterval: 30     # 秒，服务端心跳间隔
  PongTimeout: 90      # 秒，超过该时间没收到 pong 就断开
  WriteTimeout: 10     # 秒，单次写超时
  ReadLimit: 16384     # 字节，单条上行报文上限
  SendBuffer: 64       # 单连接发送队列长度

Auth:
  Secret: "uopenbox-martbox-please-change-me"  # JWT 签名密钥，生产环境必须换成随机值
  Issuer: martbox-api
  Expire: 2592000      # 秒，token 有效期，默认 30 天

Unigate:
  # 打开后打印发往 Magensa 的请求体：ARQC/磁道/KSN/卡号/CVV 会脱敏成
  # <redacted len=N sha256=xxx>，可用来判断字段是不是空的、被截断或被破坏。
  # 当前为排查 UnknownError 临时打开，定位完请改回 false。
  LogRequestBody: true

PhoneRecharegeRpc:
  Address: tcp@localhost:6002
  Name: RechargeService
  Type: p2p

LayoutRpc:
  Address: tcp@localhost:6003
  Name: LayoutService
  Type: p2p

UserRpc: 
  Endpoints:
    - 172.31.26.179:8090
  NonBlock: true
  Timeout: 10000
